<!doctype html>
<html lang="en" data-composition-variables='[
{"id":"eyebrow","type":"string","label":"Eyebrow","default":"Full-stack project · 2024 – 2025","maxLength":44},
{"id":"title","type":"string","label":"Project name","default":"SmartBlog AI","maxLength":40},
{"id":"subtitle","type":"string","label":"Subtitle","default":"Full-stack AI blogging platform","maxLength":48},
{"id":"nodes","type":"string","label":"Diagram layers, top to bottom (label::detail|label::detail)","default":"React SPA::React Router · Tailwind · React Query|Node.js / Express REST API::JWT auth · bcrypt|MongoDB::Mongoose schemas","maxLength":240},
{"id":"edges","type":"string","label":"Arrow labels between layers (a|b)","default":"REST + JWT|Mongoose","maxLength":80},
{"id":"stack","type":"string","label":"Stack, comma-separated","default":"ReactJS, Tailwind, React Router, React Query, Node.js, MongoDB, JWT","maxLength":200},
{"id":"resultValue","type":"string","label":"Result figure","default":"~45%","maxLength":8},
{"id":"resultLabel","type":"string","label":"Result label","default":"fewer redundant network calls with React Query caching","maxLength":80},
{"id":"endLine","type":"string","label":"End line","default":"The full case study is on her profile","maxLength":48},
{"id":"screen","type":"string","label":"Screenshot (assets/... path); empty shows the diagram","default":"","maxLength":120},
{"id":"clip","type":"string","label":"Screen recording (assets/... MP4); empty shows the diagram","default":"","maxLength":120}
]'>
  <head>
    <meta charset="UTF-8" />
    <!--
      demo-reel: 1080x1920, 20 s, 30 fps project intro, one per project.

      0.0-3.1   title card: eyebrow, project name, subtitle, accent bar
      3.1-10.0  her screen: a screen recording (clip) or a screenshot (screen) in a phone
                frame with a slow push-in; until she sends them, the project's own
                architecture diagram from its case study draws layer by layer
      10.0-14.2 "Built with": the stack as chips
      14.2-18.0 the headline result from her résumé
      18.0-20.0 sign-off

      Everything on screen comes from composition variables, which are copied from the
      project's post (src/content/posts/<id>.md) and her résumé. Nothing is invented.
      Render one per project:
        npx hyperframes render --strict-variables --variables-file variables/smartblog-ai.json --output renders/smartblog-ai.mp4

      Safe area: reels put the caption over the bottom and the action rail on the right,
      so the content stays between y 240 and 1400 and inside x 96-984.
    -->
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Project intro reel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ocean-deep: #075985;
        --ink: #0c1014;
        --accent: #0369a1;
        --ring-a: #34d399;
        --ring-b: #38bdf8;
        --text-1: #ffffff;
        --text-2: rgb(255 255 255 / 0.88);
        --text-3: rgb(255 255 255 / 0.78);
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }

      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--text-1);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }

      #bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom right, var(--ocean-deep), var(--ink));
      }

      #glow {
        position: absolute;
        left: 40px;
        top: 360px;
        width: 1000px;
        height: 1000px;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          color-mix(in srgb, var(--accent) 24%, transparent),
          color-mix(in srgb, var(--accent) 0%, transparent)
        );
      }

      .scene {
        position: absolute;
        inset: 0;
      }

      .column {
        position: absolute;
        inset: 240px 96px 520px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      /* ---- title card ---- */
      #eyebrow {
        font-size: 34px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: 0.02em;
        color: var(--text-3);
      }

      #title {
        margin-top: 28px;
        max-width: 888px;
        font-size: 128px;
        font-weight: 800;
        line-height: 1.02;
        letter-spacing: -0.03em;
        text-wrap: balance;
      }

      #subtitle {
        margin-top: 28px;
        max-width: 860px;
        font-size: 46px;
        font-weight: 500;
        line-height: 1.2;
        color: var(--text-2);
        text-wrap: balance;
      }

      #bar {
        width: 180px;
        height: 10px;
        margin-top: 48px;
        border-radius: 5px;
        background: linear-gradient(90deg, var(--ring-a), var(--ring-b));
        transform-origin: 0% 50%;
      }

      /* ---- diagram ---- */
      .scene-label {
        font-size: 36px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--text-3);
      }

      #diagram {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        margin-top: 44px;
      }

      .node {
        width: 840px;
        padding: 36px 40px;
        border: 2px solid rgb(255 255 255 / 0.16);
        border-radius: 32px;
        background: rgb(255 255 255 / 0.07);
      }

      .node-label {
        font-size: 54px;
        font-weight: 700;
        line-height: 1.15;
      }

      .node-detail {
        margin-top: 12px;
        font-size: 34px;
        font-weight: 500;
        line-height: 1.25;
        color: var(--text-3);
      }

      .link {
        position: relative;
        width: 100%;
        height: 132px;
      }

      .link svg {
        position: absolute;
        left: 516px;
        top: 0;
        width: 48px;
        height: 132px;
        overflow: visible;
      }

      .link path {
        fill: none;
        stroke: url(#arrowGrad);
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .edge-label {
        position: absolute;
        left: 590px;
        top: 38px;
        padding: 10px 22px;
        border-radius: 999px;
        font-size: 30px;
        font-weight: 600;
        white-space: nowrap;
        color: var(--text-1);
        background: var(--accent);
      }

      /* ---- her screen (when supplied) ---- */
      #phone {
        position: absolute;
        left: 160px;
        top: 260px;
        width: 760px;
        height: 1352px;
        overflow: hidden;
        border: 14px solid #1a1e23;
        border-radius: 72px;
        background: #000000;
        box-shadow: 0 30px 80px rgb(0 0 0 / 0.45);
      }

      #screen-img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
      }

      #clip {
        position: absolute;
        left: 174px;
        top: 274px;
        width: 732px;
        height: 1324px;
        border-radius: 58px;
        object-fit: cover;
      }

      /* ---- stack ---- */
      #chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 22px;
        max-width: 888px;
        margin-top: 48px;
      }

      .chip {
        padding: 18px 32px;
        border: 2px solid rgb(255 255 255 / 0.18);
        border-radius: 999px;
        font-size: 40px;
        font-weight: 600;
        line-height: 1.1;
        white-space: nowrap;
        background: rgb(255 255 255 / 0.08);
      }

      /* ---- result ---- */
      #result-value {
        font-size: 230px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
      }

      #result-rule {
        width: 220px;
        height: 10px;
        margin-top: 36px;
        border-radius: 5px;
        background: linear-gradient(90deg, var(--ring-a), var(--ring-b));
        transform-origin: 50% 50%;
      }

      #result-label {
        margin-top: 40px;
        max-width: 860px;
        font-size: 54px;
        font-weight: 600;
        line-height: 1.2;
        text-wrap: balance;
      }

      /* ---- sign-off ---- */
      #wordmark {
        font-size: 104px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      #end-line {
        margin-top: 28px;
        font-size: 42px;
        font-weight: 500;
        color: var(--text-2);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="demo-reel"
      data-start="0"
      data-duration="20"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg"></div>
      <div id="glow"></div>

      <section id="scene-title" class="scene clip" data-start="0" data-duration="3.1" data-track-index="1">
        <div class="column">
          <p id="eyebrow" data-var-text="eyebrow">Full-stack project · 2024 – 2025</p>
          <h1 id="title" data-var-text="title">SmartBlog AI</h1>
          <p id="subtitle" data-var-text="subtitle">Full-stack AI blogging platform</p>
          <div id="bar"></div>
        </div>
      </section>

      <section id="scene-how" class="scene clip" data-start="3.1" data-duration="6.9" data-track-index="1">
        <div id="how-diagram" class="column">
          <p id="how-label" class="scene-label">How it fits together</p>
          <svg width="0" height="0" aria-hidden="true">
            <defs>
              <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#34d399" />
                <stop offset="1" stop-color="#38bdf8" />
              </linearGradient>
            </defs>
          </svg>
          <div id="diagram"></div>
        </div>
        <div id="phone">
          <img id="screen-img" alt="" />
        </div>
      </section>

      <!-- Her screen recording, in the phone frame. Timed at the root: never inside a timed scene. -->
      <video
        id="clip"
        data-start="3.1"
        data-duration="6.9"
        data-track-index="2"
        src="assets/blank.mp4"
        data-var-src="clip"
        muted
        playsinline
      ></video>

      <section id="scene-stack" class="scene clip" data-start="10" data-duration="4.2" data-track-index="1">
        <div class="column">
          <p id="stack-label" class="scene-label">Built with</p>
          <div id="chips"></div>
        </div>
      </section>

      <section id="scene-result" class="scene clip" data-start="14.2" data-duration="3.8" data-track-index="1">
        <div class="column">
          <p id="result-value" data-var-text="resultValue">~45%</p>
          <div id="result-rule"></div>
          <p id="result-label" data-var-text="resultLabel">
            fewer redundant network calls with React Query caching
          </p>
        </div>
      </section>

      <section id="scene-end" class="scene clip" data-start="18" data-duration="2" data-track-index="1">
        <div class="column">
          <p id="wordmark">bhoomi.jain</p>
          <p id="end-line" data-var-text="endLine">The full case study is on her profile</p>
        </div>
      </section>
    </div>

    <script>
      (function () {
        "use strict";

        var FONT =
          '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
        var DEFAULTS = {
          eyebrow: "Full-stack project · 2024 – 2025",
          title: "SmartBlog AI",
          subtitle: "Full-stack AI blogging platform",
          nodes:
            "React SPA::React Router · Tailwind · React Query|Node.js / Express REST API::JWT auth · bcrypt|MongoDB::Mongoose schemas",
          edges: "REST + JWT|Mongoose",
          stack: "ReactJS, Tailwind, React Router, React Query, Node.js, MongoDB, JWT",
          resultValue: "~45%",
          resultLabel: "fewer redundant network calls with React Query caching",
          endLine: "The full case study is on her profile",
          screen: "",
          clip: "",
        };

        // Variables are read once at init, never per tick.
        var hf = window.__hyperframes || {};
        var vars = hf.getVariables ? hf.getVariables() || {} : {};
        function text(id) {
          return vars[id] == null ? DEFAULTS[id] : String(vars[id]);
        }
        function $(id) {
          return document.getElementById(id);
        }

        function fitLines(str, weight, base, min, maxWidth, maxLines, lineHeight) {
          var p = hf.pretext;
          if (!p || !p.prepare || !p.layout) return base;
          for (var size = base; size >= min; size -= 1) {
            var prepared = p.prepare(str, weight + " " + size + "px " + FONT);
            if (p.layout(prepared, maxWidth, size * lineHeight).lineCount <= maxLines) return size;
          }
          return min;
        }

        $("title").style.fontSize = fitLines(text("title"), 800, 128, 84, 888, 2, 1.02) + "px";
        $("subtitle").style.fontSize = fitLines(text("subtitle"), 500, 46, 36, 860, 2, 1.2) + "px";
        $("result-label").style.fontSize =
          fitLines(text("resultLabel"), 600, 54, 40, 860, 3, 1.2) + "px";

        // ---- the middle scene: her footage when supplied, else the case-study diagram ----
        var screen = text("screen").trim();
        var clipSrc = text("clip").trim();
        var showClip = clipSrc !== "";
        var showScreen = !showClip && screen !== "";
        $("phone").style.display = showClip || showScreen ? "block" : "none";
        $("how-diagram").style.display = showClip || showScreen ? "none" : "flex";
        $("clip").style.display = showClip ? "block" : "none";
        if (showScreen) $("screen-img").src = screen;

        var layers = text("nodes")
          .split("|")
          .map(function (s) {
            var parts = s.split("::");
            return { label: (parts[0] || "").trim(), detail: (parts[1] || "").trim() };
          })
          .filter(function (n) {
            return n.label;
          })
          .slice(0, 3);
        var edgeLabels = text("edges").split("|");
        var diagram = $("diagram");
        var nodeEls = [];
        var linkEls = [];
        layers.forEach(function (layer, i) {
          if (i > 0) {
            var link = document.createElement("div");
            link.className = "link";
            link.innerHTML =
              '<svg viewBox="0 0 48 132" aria-hidden="true"><path d="M24 8V116M10 100l14 16 14-16" /></svg>';
            var label = (edgeLabels[i - 1] || "").trim();
            if (label) {
              var pill = document.createElement("span");
              pill.className = "edge-label";
              pill.textContent = label;
              link.appendChild(pill);
            }
            diagram.appendChild(link);
            linkEls.push(link);
          }
          var node = document.createElement("div");
          node.className = "node";
          var nodeLabel = document.createElement("p");
          nodeLabel.className = "node-label";
          nodeLabel.textContent = layer.label;
          node.appendChild(nodeLabel);
          if (layer.detail) {
            var nodeDetail = document.createElement("p");
            nodeDetail.className = "node-detail";
            nodeDetail.textContent = layer.detail;
            node.appendChild(nodeDetail);
          }
          diagram.appendChild(node);
          nodeEls.push(node);
        });

        // ---- stack chips ----
        var chips = $("chips");
        var chipEls = text("stack")
          .split(",")
          .map(function (s) {
            return s.trim();
          })
          .filter(Boolean)
          .slice(0, 9)
          .map(function (name) {
            var chip = document.createElement("span");
            chip.className = "chip";
            chip.textContent = name;
            chips.appendChild(chip);
            return chip;
          });

        // ---- the one paused root timeline ----
        var tl = gsap.timeline({ paused: true });

        // Title card.
        tl.fromTo("#eyebrow", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.15);
        tl.fromTo("#title", { opacity: 0, y: 64 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0.3);
        tl.fromTo("#subtitle", { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.65);
        tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.9);
        tl.to(["#eyebrow", "#title", "#subtitle", "#bar"], { opacity: 0, y: -40, duration: 0.3, ease: "power2.in", stagger: 0.03 }, 2.75);

        // Middle scene.
        if (showClip || showScreen) {
          tl.fromTo("#phone", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 3.15);
          if (showScreen) {
            tl.fromTo("#screen-img", { scale: 1 }, { scale: 1.08, duration: 6.5, ease: "none" }, 3.15);
          }
          tl.to("#phone", { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, 9.65);
        } else {
          tl.fromTo("#how-label", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.2);
          var at = 3.45;
          nodeEls.forEach(function (node, i) {
            if (i > 0) {
              var link = linkEls[i - 1];
              var path = link.querySelector("path");
              var len = path.getTotalLength();
              path.style.strokeDasharray = len + " " + len;
              tl.fromTo(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, at);
              var pill = link.querySelector(".edge-label");
              if (pill) {
                tl.fromTo(pill, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, at + 0.3);
              }
              at += 0.55;
            }
            tl.fromTo(node, { opacity: 0, y: 48, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, at);
            at += 0.6;
          });
          tl.to("#how-diagram", { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, 9.65);
        }

        // Stack.
        tl.fromTo("#stack-label", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 10.1);
        chipEls.forEach(function (chip, i) {
          tl.fromTo(chip, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 10.35 + i * 0.12);
        });
        tl.to(["#stack-label", "#chips"], { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, 13.85);

        // Result.
        tl.fromTo("#result-value", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.5)" }, 14.35);
        tl.fromTo("#result-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 14.75);
        tl.fromTo("#result-label", { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 15.0);
        tl.to(["#result-value", "#result-rule", "#result-label"], { opacity: 0, y: -40, duration: 0.3, ease: "power2.in", stagger: 0.03 }, 17.65);

        // Sign-off.
        tl.fromTo("#wordmark", { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 18.1);
        tl.fromTo("#end-line", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 18.45);

        window.__timelines["demo-reel"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
