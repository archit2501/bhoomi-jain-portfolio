name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Time limits: a hung apt mirror once held a test job for 50 minutes (the default is 6 hours).
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run format:check

  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npm test -- --coverage
      # The runner's Azure apt mirror has hung for up to an hour at a time (22 Oct 2026), so the
      # browsers' system packages come from the main Ubuntu archive, with retries.
      - name: Install browsers
        timeout-minutes: 20
        run: |
          for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            [ -f "$f" ] && sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
          done
          for attempt in 1 2 3; do
            timeout 360 npx playwright install --with-deps chromium webkit && exit 0
            echo "::warning::Browser install attempt $attempt failed; retrying"
          done
          exit 1
      - run: npm run test:e2e

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/brand-guard.test.ts
      - run: npm run budget
      - run: npm run lighthouse
