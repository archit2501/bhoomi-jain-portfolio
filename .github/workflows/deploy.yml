name: Deploy

# Cloudflare Workers. A pull request deploys the preview Worker; production deploys after CI
# passes on main. Both stay off until the Cloudflare account is connected: set the repository
# variable DEPLOY_ENABLED to "true", the variable SITE_URL, and the secrets CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID (docs/runbook.md, "Connect Cloudflare"). Production builds refuse any
# figure Bhoomi hasn't confirmed. Roll back with `wrangler rollback` (docs/runbook.md).
#
# Previews are a separate Worker (bhoomi-jain-portfolio-preview, the `preview` environment in
# wrangler.jsonc) with its own database and KV, so a preview never touches production data.
# Database migrations run with an explicit `-c wrangler.jsonc`: after a build, wrangler would
# otherwise follow the adapter's redirect to dist/server, where migrations/ isn't.
on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every pull request shares the one preview Worker: a newer push cancels an older preview.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preview:
    # Forks get no secrets, so only branches of this repository get a preview.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - name: Build for the preview Worker
        run: npm run build
        env:
          CLOUDFLARE_ENV: preview

      # Cloudflare gives no per-version preview links to a Worker with a Durable Object (Presence),
      # so a pull request deploys the separate preview Worker itself: one preview at a time, the
      # latest push wins. The first deploy also creates its own database, KV and rate limiters.
      - name: Deploy the preview Worker (production is not touched)
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx wrangler deploy --message "PR #$PR at $SHA" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(jq -r 'select(.type == "deploy") | .targets[]? | select(startswith("https://"))' "$WRANGLER_OUTPUT_FILE_PATH" | head -1)
          [ -n "$url" ] || url=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          [ -n "$url" ] || { echo "::error::No preview URL in the wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Migrate the preview database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote -c wrangler.jsonc --env preview

      - name: Smoke-test the preview
        env:
          BASE: ${{ steps.preview.outputs.url }}
        run: |
          for path in / /api/health /p/smartblog-ai/ /stories/projects/ /og/default.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$BASE$path") || true
            echo "$path -> $code"
            [ "$code" = 200 ] || { echo "::error::$BASE$path returned $code"; exit 1; }
          done

      - name: Link the preview on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none \
            --body "Preview of \`${SHA:0:7}\`: $URL (production is unchanged)."

  production:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci

      - name: Build, refusing unconfirmed figures
        run: npm run build
        env:
          REQUIRE_VERIFIED: '1'
          # "true" while her posts are still text tiles: the build lists them instead of refusing
          # them. Unconfirmed figures are refused either way. Delete the variable once photos are in.
          ALLOW_TEXT_POSTS: ${{ vars.ALLOW_TEXT_POSTS }}
          SITE_URL: ${{ vars.SITE_URL }}
          # Turnstile's public site key; without it the build falls back to the test key, which
          # the production secret rejects (every write would fail).
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - name: Brand guard on the built site and the domain
        run: npx vitest run tests/brand-guard.test.ts
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # The build that ships is the one measured: its scores go into the site as /lighthouse.json,
      # with this run's link, for Insights. A score under the bar (lighthouserc.json) stops here.
      - name: Measure the build with Lighthouse and publish the scores on Insights
        run: |
          npm run lighthouse
          node scripts/lighthouse-summary.mjs .lighthouseci dist/client/lighthouse.json

      # Migrations are additive, so the database moves ahead of the code that needs it. On the very
      # first deploy there is no database yet: the deploy creates it and the step after migrates.
      - name: Migrate the database (before the code that needs it)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --remote -c wrangler.jsonc \
            || echo "::notice::No database yet; the deploy creates it and the next step migrates it."

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: npx wrangler deploy --message "main at $SHA"

      - name: Migrate the database (first deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote -c wrangler.jsonc

      # Pages, files, the API, the database, and every off switch on (scripts/smoke.mjs).
      - name: Smoke-test the live site
        env:
          BASE: ${{ vars.SITE_URL }}
        run: npm run smoke:prod
